name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholder public values so the client bundle builds. Real values live in
      # Vercel project settings; no secrets are needed for CI.
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
      VITE_SUPABASE_PROJECT_ID: placeholder
      VITE_SITE_URL: https://nestly-homes.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build
